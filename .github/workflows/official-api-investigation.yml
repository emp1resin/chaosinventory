name: Official API import verification (no deployment)
on:
  pull_request:
    paths:
      - 'site-source/**'
      - 'backend/**'
      - '.github/workflows/official-api-investigation.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
        working-directory: site-source
      - name: Failure and state-isolation tests
        working-directory: site-source
        env:
          NODE_ENV: production
        run: |
          node scripts/test-official-api.mjs
          node scripts/test-import-reset.mjs
          node scripts/test-runes.mjs
          node scripts/test-equipment-resolution.mjs
          node scripts/test-item-focus.mjs
      - name: Full import from fresh official data
        run: node scripts/verify-official-import-live.mjs
        working-directory: site-source
        env:
          NODE_ENV: production
      - name: Build for GitHub Pages without publishing
        run: npm run build -- --base /chaosinventory/
        working-directory: site-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-import-observations
          path: site-source/official-import-observations
          retention-days: 7
