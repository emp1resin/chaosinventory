name: Network investigation (no deployment)
on:
  pull_request:
    paths:
      - 'site-source/scripts/audit-network.mjs'
      - 'site-source/scripts/test-network-failures.mjs'
      - 'site-source/scripts/audit-clan-glory.mjs'
      - 'diagnostics/index.html'
      - '.github/workflows/network-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only network and CORS checks
        run: node site-source/scripts/audit-network.mjs
      - name: Install test dependencies
        working-directory: site-source
        run: npm ci --legacy-peer-deps
      - name: Reproduce failures in current production modules
        working-directory: site-source
        run: node --experimental-vm-modules scripts/test-network-failures.mjs
      - name: Compare clan positions on live character data without changing source
        working-directory: site-source
        env:
          NODE_ENV: production
        run: node scripts/audit-clan-glory.mjs
